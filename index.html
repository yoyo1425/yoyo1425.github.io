<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>屑长弓的官方网站</title>
    <style>
        /* ===== 全局重置 & 基础 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #000;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            padding: 20px;
        }

        /* ===== 代码雨 Canvas ===== */
        #codeRain {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* ===== 内容容器 ===== */
        .content {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 820px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
            padding: 20px 0;
        }

        /* ===== 主卡片 - 液态玻璃效果 ===== */
        .glass-card {
            width: 100%;
            background: rgba(0, 20, 0, 0.35);
            backdrop-filter: blur(16px) saturate(1.2);
            -webkit-backdrop-filter: blur(16px) saturate(1.2);
            border: 1px solid rgba(0, 255, 65, 0.15);
            border-radius: 32px;
            box-shadow:
                0 8px 48px rgba(0, 0, 0, 0.7),
                inset 0 1px 0 rgba(0, 255, 65, 0.08),
                0 0 80px rgba(0, 255, 65, 0.03);
            padding: 40px 36px 48px;
            transition: box-shadow 0.4s ease, border-color 0.4s ease;
            text-align: center;
        }

        .glass-card:hover {
            border-color: rgba(0, 255, 65, 0.30);
            box-shadow:
                0 8px 56px rgba(0, 0, 0, 0.8),
                inset 0 1px 0 rgba(0, 255, 65, 0.15),
                0 0 100px rgba(0, 255, 65, 0.06);
        }

        /* ===== 标题 ===== */
        .site-title {
            font-size: 2.6rem;
            font-weight: 700;
            letter-spacing: 4px;
            color: #b0ffb0;
            text-shadow:
                0 0 20px rgba(0, 255, 65, 0.25),
                0 0 60px rgba(0, 255, 65, 0.08);
            margin-bottom: 6px;
            font-family: 'Courier New', monospace;
            word-break: break-word;
        }

        /* ===== 天数 ===== */
        .days-display {
            font-size: 3.8rem;
            font-weight: 700;
            color: #00ff41;
            text-shadow:
                0 0 30px rgba(0, 255, 65, 0.40),
                0 0 80px rgba(0, 255, 65, 0.12);
            margin-bottom: 28px;
            letter-spacing: 2px;
            font-family: 'Courier New', monospace;
            line-height: 1.2;
        }

        .days-display .highlight {
            color: #7dffb3;
            text-shadow:
                0 0 40px rgba(0, 255, 65, 0.60),
                0 0 100px rgba(0, 255, 65, 0.20);
        }

        /* ===== 分隔装饰 ===== */
        .divider {
            width: 60%;
            height: 1px;
            margin: 8px auto 28px;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 65, 0.25), transparent);
            border: none;
        }

        /* ===== 留言板标题行 ===== */
        .board-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .board-header h2 {
            font-size: 1.2rem;
            font-weight: 400;
            color: #88dd88;
            letter-spacing: 2px;
            text-shadow: 0 0 12px rgba(0, 255, 65, 0.15);
        }

        .board-header .count-badge {
            font-size: 0.85rem;
            color: #66bb66;
            background: rgba(0, 255, 65, 0.08);
            padding: 4px 16px;
            border-radius: 30px;
            border: 1px solid rgba(0, 255, 65, 0.10);
            backdrop-filter: blur(4px);
        }

        /* ===== 留言列表容器 ===== */
        .message-board {
            max-height: 380px;
            overflow-y: auto;
            margin-bottom: 24px;
            padding-right: 4px;
            scroll-behavior: smooth;
        }

        .message-board::-webkit-scrollbar {
            width: 5px;
        }
        .message-board::-webkit-scrollbar-track {
            background: rgba(0, 255, 65, 0.04);
            border-radius: 10px;
        }
        .message-board::-webkit-scrollbar-thumb {
            background: rgba(0, 255, 65, 0.25);
            border-radius: 10px;
            transition: background 0.3s;
        }
        .message-board::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 255, 65, 0.45);
        }

        /* ===== 单条留言 ===== */
        .message-item {
            background: rgba(0, 255, 65, 0.03);
            border: 1px solid rgba(0, 255, 65, 0.06);
            border-radius: 16px;
            padding: 14px 20px;
            margin-bottom: 12px;
            text-align: left;
            backdrop-filter: blur(4px);
            transition: border-color 0.3s, background 0.3s, transform 0.2s;
            animation: msgFadeIn 0.35s ease-out;
        }

        .message-item:hover {
            border-color: rgba(0, 255, 65, 0.18);
            background: rgba(0, 255, 65, 0.06);
            transform: translateX(3px);
        }

        .message-item .msg-name {
            font-weight: 700;
            color: #66ff99;
            font-size: 1.05rem;
            text-shadow: 0 0 12px rgba(0, 255, 65, 0.12);
            display: inline-block;
            margin-right: 8px;
        }

        .message-item .msg-content {
            color: #d0f0d0;
            font-size: 0.98rem;
            line-height: 1.5;
            word-break: break-word;
        }

        .message-item .msg-time {
            display: block;
            font-size: 0.7rem;
            color: #558855;
            margin-top: 6px;
            text-align: right;
            letter-spacing: 0.5px;
        }

        .message-empty {
            color: #446644;
            font-size: 0.95rem;
            padding: 30px 0;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(0, 255, 65, 0.04);
        }

        @keyframes msgFadeIn {
            0% {
                opacity: 0;
                transform: translateY(12px) scale(0.97);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ===== 留言表单 ===== */
        .message-form {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-top: 4px;
        }

        .form-row {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
        }

        .form-row .input-group {
            flex: 1;
            min-width: 140px;
        }

        .message-form input,
        .message-form textarea {
            width: 100%;
            padding: 14px 18px;
            background: rgba(0, 30, 0, 0.50);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(0, 255, 65, 0.12);
            border-radius: 16px;
            color: #c8f0c8;
            font-family: 'Courier New', monospace;
            font-size: 0.95rem;
            transition: border-color 0.3s, box-shadow 0.3s, background 0.3s;
            outline: none;
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.30);
        }

        .message-form input::placeholder,
        .message-form textarea::placeholder {
            color: #4a7a4a;
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        .message-form input:focus,
        .message-form textarea:focus {
            border-color: rgba(0, 255, 65, 0.40);
            background: rgba(0, 40, 0, 0.55);
            box-shadow: 0 0 24px rgba(0, 255, 65, 0.06), inset 0 2px 8px rgba(0, 0, 0, 0.30);
        }

        .message-form textarea {
            resize: vertical;
            min-height: 72px;
            max-height: 160px;
            line-height: 1.5;
        }

        .message-form .btn-submit {
            padding: 14px 32px;
            background: rgba(0, 255, 65, 0.10);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(0, 255, 65, 0.25);
            border-radius: 60px;
            color: #88ffaa;
            font-family: 'Courier New', monospace;
            font-size: 1.05rem;
            font-weight: 600;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.30);
            text-shadow: 0 0 12px rgba(0, 255, 65, 0.10);
            align-self: flex-end;
            min-width: 160px;
        }

        .message-form .btn-submit:hover {
            background: rgba(0, 255, 65, 0.18);
            border-color: rgba(0, 255, 65, 0.50);
            box-shadow: 0 0 40px rgba(0, 255, 65, 0.12), 0 4px 24px rgba(0, 0, 0, 0.30);
            transform: translateY(-2px);
            color: #b0ffcc;
        }

        .message-form .btn-submit:active {
            transform: translateY(0px) scale(0.98);
        }

        /* ===== 响应式 ===== */
        @media (max-width: 640px) {
            .glass-card {
                padding: 28px 18px 32px;
                border-radius: 24px;
            }
            .site-title {
                font-size: 1.8rem;
                letter-spacing: 2px;
            }
            .days-display {
                font-size: 2.6rem;
            }
            .form-row {
                flex-direction: column;
            }
            .form-row .input-group {
                min-width: unset;
            }
            .message-form .btn-submit {
                align-self: stretch;
                width: 100%;
            }
            .board-header {
                flex-direction: column;
                align-items: center;
            }
            .message-board {
                max-height: 280px;
            }
        }

        @media (max-width: 400px) {
            .site-title {
                font-size: 1.4rem;
            }
            .days-display {
                font-size: 2.0rem;
            }
            .glass-card {
                padding: 20px 12px 24px;
            }
            .message-item {
                padding: 12px 14px;
            }
        }

        /* ===== 工具类 ===== */
        .hidden {
            display: none !important;
        }

        .glow-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            background: #00ff41;
            border-radius: 50%;
            box-shadow: 0 0 16px #00ff41;
            margin-right: 6px;
            vertical-align: middle;
            animation: pulseDot 2.4s ease-in-out infinite;
        }

        @keyframes pulseDot {
            0%,
            100% {
                opacity: 0.4;
                transform: scale(0.8);
            }
            50% {
                opacity: 1;
                transform: scale(1.2);
            }
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: rgba(0, 30, 0, 0.80);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 255, 65, 0.20);
            border-radius: 60px;
            padding: 12px 32px;
            color: #88ffaa;
            font-size: 0.95rem;
            font-family: 'Courier New', monospace;
            letter-spacing: 1px;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.60);
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            pointer-events: none;
            z-index: 999;
            white-space: nowrap;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        @media (max-width: 480px) {
            .toast {
                white-space: normal;
                max-width: 90%;
                text-align: center;
                padding: 12px 20px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>

    <!-- ===== 代码雨 Canvas ===== -->
    <canvas id="codeRain"></canvas>

    <!-- ===== Toast 提示 ===== -->
    <div id="toast" class="toast">✓ 留言已发送</div>

    <!-- ===== 主内容 ===== -->
    <div class="content">
        <div class="glass-card">

            <!-- 标题 -->
            <h1 class="site-title">
                <span class="glow-dot"></span>屑长弓的官方网站
            </h1>

            <!-- 天数 -->
            <div class="days-display">
                已做 <span class="highlight" id="daysCount">0</span> 天 up
            </div>

            <div class="divider"></div>

            <!-- 留言板 -->
            <div class="board-header">
                <h2>✦ 访客留言</h2>
                <span class="count-badge" id="msgCount">共 0 条</span>
            </div>

            <div class="message-board" id="messageBoard">
                <div class="message-empty">💬 加载留言中...</div>
            </div>

            <!-- 留言表单 -->
            <form class="message-form" id="messageForm" autocomplete="off">
                <div class="form-row">
                    <div class="input-group">
                        <input type="text" id="nameInput" placeholder="你的名字" maxlength="20">
                    </div>
                    <div class="input-group" style="flex:2;">
                        <input type="text" id="messageInput" placeholder="想说的话..." maxlength="200" required>
                    </div>
                </div>
                <button type="submit" class="btn-submit">发送留言</button>
            </form>

        </div>
    </div>

    <script>
        // ============================================================
        //  1. 代码雨 - 更快更清晰
        // ============================================================
        (function initCodeRain() {
            const canvas = document.getElementById('codeRain');
            const ctx = canvas.getContext('2d');

            let W, H;
            const CHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            const FONT_SIZE = 20;
            let columns = [];
            let columnCount = 0;
            let animationId = null;

            function resize() {
                W = canvas.width = window.innerWidth;
                H = canvas.height = window.innerHeight;
                columnCount = Math.floor(W / FONT_SIZE) + 2;
                columns = [];
                for (let i = 0; i < columnCount; i++) {
                    columns.push({
                        x: i * FONT_SIZE + Math.random() * 6,
                        y: Math.random() * H * -1,
                        speed: 1.8 + Math.random() * 2.8,
                        length: 5 + Math.floor(Math.random() * 12),
                        chars: []
                    });
                    const col = columns[columns.length - 1];
                    for (let j = 0; j < col.length; j++) {
                        col.chars.push(CHARS[Math.floor(Math.random() * CHARS.length)]);
                    }
                }
            }

            function drawRain() {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.18)';
                ctx.fillRect(0, 0, W, H);

                for (let i = 0; i < columns.length; i++) {
                    const col = columns[i];
                    col.y += col.speed;

                    if (col.y > H + 20) {
                        col.y = -col.length * FONT_SIZE - Math.random() * 80;
                        col.speed = 1.8 + Math.random() * 2.8;
                        col.length = 5 + Math.floor(Math.random() * 12);
                        col.chars = [];
                        for (let j = 0; j < col.length; j++) {
                            col.chars.push(CHARS[Math.floor(Math.random() * CHARS.length)]);
                        }
                    }

                    for (let j = 0; j < col.length; j++) {
                        const yPos = col.y - j * FONT_SIZE;
                        if (yPos < -FONT_SIZE || yPos > H + FONT_SIZE) continue;

                        const intensity = 1 - (j / col.length) * 0.75;
                        const green = Math.floor(140 + 180 * intensity);
                        const red = Math.floor(5 + 15 * intensity);
                        const blue = Math.floor(5 + 15 * intensity);

                        let color;
                        if (j === 0) {
                            color = `rgba(220, 255, 220, ${0.95 + 0.05 * Math.random()})`;
                        } else if (j === 1) {
                            color = `rgba(140, 255, 180, ${0.7 + 0.2 * Math.random()})`;
                        } else {
                            color = `rgba(${red}, ${green}, ${blue}, ${0.6 + 0.3 * intensity})`;
                        }

                        ctx.fillStyle = color;
                        ctx.font = `${FONT_SIZE}px 'Courier New', monospace`;
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'top';

                        if (Math.random() < 0.04) {
                            col.chars[j] = CHARS[Math.floor(Math.random() * CHARS.length)];
                        }

                        ctx.fillText(col.chars[j], col.x, yPos);
                    }
                }

                animationId = requestAnimationFrame(drawRain);
            }

            window.addEventListener('resize', () => {
                resize();
            });

            resize();
            drawRain();

            window.addEventListener('beforeunload', () => {
                if (animationId) cancelAnimationFrame(animationId);
            });
        })();


        // ============================================================
        //  2. 日期计算 - 每分钟自动刷新
        // ============================================================
        (function updateDays() {
            function calcAndDisplay() {
                const start = new Date(2025, 5, 15);
                const now = new Date();
                const startDay = new Date(start.getFullYear(), start.getMonth(), start.getDate());
                const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
                const diff = Math.floor((today - startDay) / (1000 * 60 * 60 * 24));
                document.getElementById('daysCount').textContent = diff >= 0 ? diff : 0;
            }
            calcAndDisplay();
            setInterval(calcAndDisplay, 60000);
        })();


        // ============================================================
        //  3. 留言板 - 后端版本 (Flask API)
        // ============================================================
        (function initGuestbook() {
            const boardEl = document.getElementById('messageBoard');
            const countEl = document.getElementById('msgCount');
            const form = document.getElementById('messageForm');
            const nameInput = document.getElementById('nameInput');
            const msgInput = document.getElementById('messageInput');
            const toast = document.getElementById('toast');

            const API_URL = '/api/messages'; // 同域下请求

            // ----- 加载留言 -----
            async function loadMessages() {
                try {
                    const response = await fetch(API_URL);
                    if (!response.ok) throw new Error('Failed to fetch');
                    const messages = await response.json();
                    renderMessages(messages);
                } catch (err) {
                    console.error('加载留言失败:', err);
                    boardEl.innerHTML = `<div class="message-empty">⚠️ 无法连接服务器，请确保后端已运行 (python app.py)</div>`;
                    if (countEl) countEl.textContent = '共 0 条';
                }
            }

            // ----- 渲染留言 -----
            function renderMessages(messages) {
                if (!boardEl) return;
                if (!messages || messages.length === 0) {
                    boardEl.innerHTML = `<div class="message-empty">💬 还没有留言，快来留下你的足迹吧~</div>`;
                    if (countEl) countEl.textContent = '共 0 条';
                    return;
                }

                let html = '';
                for (const msg of messages) {
                    const timeStr = formatTime(msg.timestamp);
                    const name = escapeHtml(msg.name) || '匿名';
                    const content = escapeHtml(msg.content) || '（空）';
                    html += `
                        <div class="message-item">
                            <span class="msg-name">${name}</span>
                            <span class="msg-content">${content}</span>
                            <span class="msg-time">${timeStr}</span>
                        </div>
                    `;
                }
                boardEl.innerHTML = html;
                if (countEl) countEl.textContent = `共 ${messages.length} 条`;
                boardEl.scrollTop = 0;
            }

            // ----- 提交留言 -----
            async function submitMessage(name, content) {
                try {
                    const response = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name, content })
                    });
                    if (!response.ok) {
                        const err = await response.json();
                        throw new Error(err.error || '提交失败');
                    }
                    return true;
                } catch (err) {
                    console.error('提交留言失败:', err);
                    showToast('⚠️ 提交失败: ' + err.message);
                    return false;
                }
            }

            // ----- 辅助函数 -----
            function formatTime(ts) {
                const d = new Date(ts);
                const pad = n => String(n).padStart(2, '0');
                return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
            }

            function escapeHtml(str) {
                if (!str) return '';
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }

            let toastTimer = null;

            function showToast(text) {
                toast.textContent = text;
                toast.classList.add('show');
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => {
                    toast.classList.remove('show');
                }, 2200);
            }

            // ----- 表单事件 -----
            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                const name = nameInput.value.trim();
                const content = msgInput.value.trim();
                if (!content) {
                    showToast('⚠️ 请写下你想说的话');
                    msgInput.focus();
                    return;
                }

                const success = await submitMessage(name, content);
                if (success) {
                    nameInput.value = '';
                    msgInput.value = '';
                    showToast('✓ 留言已发送');
                    nameInput.focus();
                    await loadMessages(); // 刷新列表
                }
            });

            msgInput.addEventListener('keydown', function(e) {
                if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                    form.dispatchEvent(new Event('submit'));
                }
            });

            // ----- 启动 -----
            loadMessages();
        })();
    </script>

</body>
</html>
